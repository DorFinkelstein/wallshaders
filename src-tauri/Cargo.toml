[package]
name = "wallshaders"
version = "0.1.0"
description = "Shader wallpapers for Windows"
edition = "2021"

[lib]
name = "wallshaders_lib"
path = "src/lib.rs"

[[bin]]
name = "wallshaders"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
wallshaders-renderer = { path = "../renderer" }
